---
layout: default
---
<section class="page-hero">
  <div class="beam" aria-hidden="true"></div>
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>
<article class="wrap prose">
{{ content }}
</article>
