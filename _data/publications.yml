topics:
  - id: levitated
    name: Levitated optomechanics & quantum control
    blurb: Optically levitated nanoparticles in vacuum, with programmable potentials, interactions and feedback.
  - id: thermo
    name: Thermodynamics of information & quantum thermodynamics
    blurb: Memories, erasure, work extraction and entropy production in classical and quantum systems.
  - id: photonic
    name: Photonic entanglement & quantum networks
    blurb: Hyperentangled and cluster states of photons, on chip and in bulk optics, and their characterisation.
  - id: metrology
    name: Quantum metrology & quantum channels
    blurb: Multiparameter quantum estimation and experimental bounds on the capacities of quantum channels.

