<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
      <span class="brand-mark" aria-hidden="true">MAC</span>
      <span class="brand-name">{{ site.author.name }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-burger" aria-label="Open menu"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
